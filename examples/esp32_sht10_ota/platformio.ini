[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    Practical-Arduino/SHT1x@^1.0.2

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++11
    -DUNIT_TEST
    -DARDUINO=100
lib_compat_mode = off
