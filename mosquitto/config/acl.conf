# ACL Configuration

# Admin user can do everything
user admin
topic readwrite #

# Server can read and write to all topics
user server
topic readwrite #

# Nodes can only publish to their specific topics and subscribe to commands
# Note: usernames are in format 'node_<node_id>', topics use '<node_id>'
# This allows node_esp32_01 to access bms/node/node_esp32_01/*
pattern read bms/node/%u/command
pattern write bms/node/%u/data
pattern write bms/node/%u/status
